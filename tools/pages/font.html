<!doctype html>
<!--
  Laboratorio: Archivo (quello del sito, 400–900, 41 KB) contro Manrope (200–800, OFL, parte latina 24 KB, senza corsivo),
  in celle come quelle del sito sulla carta a quadretti: titolone con la lente (normale e al contrario), titoletto,
  paragrafo coi **concetti**, cifre che contano, alfabeto. Etichette in JetBrains Mono (quello del sito). Riga "cifre tabellari": misurata dal browser.
  Archivo, JetBrains Mono e logotipo dai file del sito (/fonts/), Manrope da Google Fonts. Solo sviluppo.
  Provati e tolti: Hanken Grotesk (3/11/2026); Host Grotesk, Geist, Geist Mono e Google Sans Flex (5/11/2026). Di Google Sans Flex
  (wght 1–1000, wdth 25–151, opsz, ROND; niente GRAD su Google Fonts) c'erano anche titolone a larghezza e lente compensata
  con la larghezza: tutto nella cronologia di git. Parte latina: solo wght 51 KB · wght+wdth 119 KB · tutti gli assi ~1 MB.
    npx astro build && npm run vt:serve  →  http://localhost:4400/_vt/font.html  (anche dal telefono)
  La versione di prima (Schibsted Grotesk contro Archivo e Mona Sans, ottobre 2026) è nella cronologia di git.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Font · laboratorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap">
<style>
  @font-face { font-family: 'Roberto Grafica'; src: url('/fonts/roberto-grafica-black.woff2') format('woff2'); font-weight: 900; font-display: block; }
  @font-face { font-family: 'Archivo'; src: url('/fonts/archivo.woff2') format('woff2'); font-weight: 400 900; font-display: block; }
  @font-face { font-family: 'JetBrains Mono'; src: url('/fonts/jetbrains-mono.woff2') format('woff2'); font-weight: 400 800; font-display: block; }

  :root {
    --chiaro: #f5f3f0; --nero: #1c1a17; --rosso: #f03f24;
    --inchiostro: var(--nero); --bianco: var(--chiaro);
    --q: 25px; --line: 1px; --pad: calc(var(--q) * 0.4); --pad-label: calc(var(--q) * 1.24);
    --titolone: 64px; --titoletto: 24px; --paragrafo: 16px; --corpo-mono: 11px;
    --mono: 'JetBrains Mono'; --mono-spazio: 0.02em;
  }
  @media (max-width: 599px) { :root { --q: 18px; --titolone: 46px; --titoletto: 18px; --paragrafo: 15px; } }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color: var(--inchiostro); -webkit-font-smoothing: antialiased; }
  /* la carta del tavolo: linee al 22% dell'inchiostro */
  body {
    min-height: 100vh; font-family: 'Archivo', sans-serif;
    background-color: var(--bianco);
    background-image:
      linear-gradient(to right, color-mix(in srgb, var(--inchiostro) 22%, transparent) var(--line), transparent var(--line)),
      linear-gradient(to bottom, color-mix(in srgb, var(--inchiostro) 22%, transparent) var(--line), transparent var(--line));
    background-size: var(--q) var(--q);
  }

  .mono { font-family: var(--mono), monospace; font-size: var(--corpo-mono); line-height: 1.2; letter-spacing: var(--mono-spazio);
    text-transform: uppercase; font-variant-numeric: tabular-nums; }

  /* barra dei comandi */
  .bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
    padding: 10px var(--q); background: var(--inchiostro); color: var(--bianco); }
  .bar .firma { font: 900 var(--q)/0.68 'Roberto Grafica'; padding-top: 0.06em; margin-right: 10px; }
  .gruppo { display: flex; align-items: center; gap: 6px; }
  .bar button { font: inherit; letter-spacing: inherit; text-transform: inherit; padding: 5px 8px;
    border: var(--line) solid var(--bianco); background: none; color: var(--bianco); cursor: default; }
  .bar button[aria-pressed="true"] { background: var(--bianco); color: var(--inchiostro); }
  .bar input[type="text"] { font: 500 13px/1 'Archivo', sans-serif; padding: 5px 8px; width: min(320px, 100%);
    border: var(--line) solid var(--bianco); background: none; color: var(--bianco); color-scheme: dark; }

  /* una colonna per font, larga un numero intero di quadretti */
  .tavolo { display: grid; gap: var(--q); padding: var(--q); grid-template-columns: repeat(auto-fit, minmax(min(100%, calc(var(--q) * 17 - var(--line))), 1fr)); }
  .colonna { display: grid; gap: var(--q); align-content: start; }

  /* cella: fondo carta, filo da 1px, margini come sul sito */
  .cell { position: relative; background: var(--bianco); border: var(--line) solid var(--inchiostro);
    padding: var(--pad-label) var(--pad) var(--pad); container-type: inline-size; }
  .cell--piena { background: var(--inchiostro); color: var(--bianco); border-color: var(--inchiostro); }
  .cell__label { position: absolute; top: var(--pad); left: var(--pad); right: var(--pad); display: flex; justify-content: space-between; gap: 10px; }
  .cell > * + * { margin-top: var(--q); }

  .f { font-family: var(--f), sans-serif; }
  .titolone { font-weight: 900; line-height: 0.85; letter-spacing: -0.05em; font-size: var(--titolone); overflow-wrap: break-word; }
  .titolone .riga { display: block; white-space: nowrap; }
  .titoletto { font-weight: 500; line-height: 1; letter-spacing: -0.025em; font-size: var(--titoletto); text-wrap: balance; }
  .paragrafo { max-width: 44ch; font-size: var(--paragrafo); line-height: 1.35; font-weight: 400; text-wrap: pretty; }
  .paragrafo + .paragrafo { margin-top: 1.35em; }
  .paragrafo strong { font-weight: 600; }
  .cifra { font-size: var(--titolone); font-weight: 800; line-height: 0.85; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .cifre { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .alfabeto { font-size: 20px; line-height: 1.35; font-weight: 400; overflow-wrap: anywhere; }
  .pesi { display: grid; gap: 2px; font-size: 22px; line-height: 1.1; letter-spacing: -0.02em; }
  .pesi span { display: flex; justify-content: space-between; gap: 10px; white-space: nowrap; overflow: hidden; }
  .pesi .mono { align-self: center; }
  .sì { color: inherit; }
  .no { color: var(--rosso); }
  [contenteditable]:focus-visible { outline: var(--line) dashed currentColor; outline-offset: 4px; }
</style>
</head>
<body>
<div class="bar mono">
  <span class="firma" aria-hidden="true">ROBERTO</span>
  <span class="gruppo">Lente
    <button type="button" data-lente="normale" aria-pressed="true">Normale</button>
    <button type="button" data-lente="inversa" aria-pressed="false">Al contrario</button>
  </span>
  <span class="gruppo">Fino a
    <button type="button" data-fino="400" aria-pressed="true">400 (oggi)</button>
    <button type="button" data-fino="1" aria-pressed="false">Il più sottile</button>
  </span>
  <input type="text" id="titolo" value="Progetto identità per ristoranti e piccole aziende" aria-label="Testo del titolone" spellcheck="false">
</div>

<template id="tpl">
  <div class="colonna">
    <div class="cell">
      <div class="cell__label mono"><span class="nome"></span><span class="nota"></span></div>
      <h2 class="f titolone" data-titolone></h2>
    </div>
    <div class="cell">
      <div class="cell__label mono"><span>Info</span><span>→</span></div>
      <p class="f titoletto" contenteditable spellcheck="false">Marchi, cataloghi e siti tra Itri, Formia e Latina</p>
      <div>
        <p class="f paragrafo" contenteditable spellcheck="false">Ogni progetto parte da un <strong>foglio a quadretti</strong>, poi diventa un sistema: caratteri, colori, regole. Lavoro con <strong>ristoranti, hotel e piccole aziende</strong> che vogliono farsi riconoscere.</p>
        <p class="f paragrafo" contenteditable spellcheck="false">Disegno anche il <strong>sito</strong>, quando serve. Perché funzioni, non solo perché sia bello: àèéìòù «€ 1.250» · 3/4 · n° 42…</p>
      </div>
    </div>
    <div class="cell cell--piena">
      <div class="cell__label mono"><span>Progetti</span><span class="tab"></span></div>
      <div class="cifre"><span class="f cifra" data-conta>0</span><span class="mono">dal 2016</span></div>
    </div>
    <div class="cell">
      <div class="cell__label mono"><span>Pesi</span><span class="escursione"></span></div>
      <div class="f pesi"></div>
    </div>
    <div class="cell">
      <div class="cell__label mono"><span>Alfabeto</span><span>ore 14:07 · 41,2° N</span></div>
      <p class="f alfabeto" contenteditable spellcheck="false">ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz 0123456789 àèéìòù € &amp; @ ? ! → ← «»</p>
    </div>
  </div>
</template>

<main class="tavolo" id="tavolo"></main>

<script>
  const FONT = [
    { nome: 'Archivo', f: "'Archivo'", min: 400, max: 900, nota: 'oggi · 400–900' },
    { nome: 'Manrope', f: "'Manrope'", min: 200, max: 800, nota: '200–800' },
  ];
  const RAGGIO = 2.5, SMORZA = 90;   // come scripts/titoloni.ts: raggio in corpi del titolo, smorzamento in ms
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FINE = matchMedia('(hover: hover) and (pointer: fine)').matches;
  const stato = { lente: 'normale', fino: 400 };
  const html = document.documentElement;

  const tavolo = document.getElementById('tavolo');
  const tpl = document.getElementById('tpl');
  const campo = document.getElementById('titolo');
  const colonne = FONT.map((font, i) => {
    const el = tpl.content.firstElementChild.cloneNode(true);
    el.style.setProperty('--f', font.f);
    el.querySelector('.nome').textContent = String(i + 1).padStart(2, '0') + ' · ' + font.nome;
    el.querySelector('.nota').textContent = font.nota;
    el.querySelector('.escursione').textContent = font.min + '–' + font.max;
    const pesi = el.querySelector('.pesi');
    for (let w = 100; w <= 900; w += 100) {
      const s = document.createElement('span'), manca = w < font.min || w > font.max;
      s.style.fontWeight = w;
      // fuori dall'escursione del file il browser usa il peso più vicino: si vede, ma sbiadito
      s.innerHTML = `<span>Ristorante</span><span class="mono">${w}${manca ? ' · non c’è' : ''}</span>`;
      if (manca) s.style.opacity = 0.35;
      pesi.append(s);
    }
    tavolo.append(el);
    const titolo = el.querySelector('[data-titolone]');
    return { font, el, titolo, cella: titolo.closest('.cell'), lettere: [], pesi: [] };
  });

  // [peso a riposo, peso al centro]. Normale: 500 → 900 come sul sito (col "più sottile": dal minimo del font).
  // Al contrario: 900 → 400 come sul sito (col "più sottile": fino al minimo del font). 900 = il più nero che il font ha
  function pesiDi(col) {
    const sottile = Math.max(stato.fino, col.font.min), nero = col.font.max;
    return stato.lente === 'normale' ? [stato.fino === 1 ? sottile : 500, nero] : [nero, sottile];
  }

  /* titolone: lettere in span e righe bloccate (come .lente__riga del sito), così le parole che ingrassano non cambiano riga.
     Le righe si leggono col peso a riposo */
  function componi() {
    const parole = (campo.value.trim() || ' ').split(/\s+/);
    for (const col of colonne) {
      const t = col.titolo, base = pesiDi(col)[0];
      t.textContent = '';
      const spans = parole.map((p, i) => {
        const w = document.createElement('span');
        w.style.display = 'inline-block';
        for (const ch of p) { const l = document.createElement('span'); l.textContent = ch; l.style.fontWeight = base; w.append(l); }
        t.append(w);
        if (i < parole.length - 1) t.append(' ');
        return w;
      });
      const righe = [];
      for (const w of spans) {
        if (!righe.length || Math.abs(righe.at(-1).top - w.offsetTop) > 2) righe.push({ top: w.offsetTop, parole: [] });
        righe.at(-1).parole.push(w);
      }
      t.textContent = '';
      for (const r of righe) {
        const riga = document.createElement('span');
        riga.className = 'riga';
        r.parole.forEach((w, i) => { riga.append(w); if (i < r.parole.length - 1) riga.append(' '); });
        t.append(riga);
      }
      col.lettere = [...t.querySelectorAll('.riga > span > span')];
      col.pesi = col.lettere.map(() => base);
    }
  }

  /* lente: stesso calcolo di scripts/titoloni.ts (coseno sul raggio, peso che insegue con smorzamento esponenziale).
     Il puntatore è letto in proporzione alla cella e riportato in tutte e tre: si confrontano nello stesso punto */
  let pointer = null, loop = 0, prev = 0;
  function frame(now) {
    const dt = prev ? now - prev : 16;
    prev = now;
    let moving = false;
    for (const col of colonne) {
      const [base, centro] = pesiDi(col);
      const R = RAGGIO * parseFloat(getComputedStyle(col.titolo).fontSize);
      let p = null;
      if (pointer) {
        const c = col.cella.getBoundingClientRect();
        p = { x: c.left + pointer.fx * c.width, y: c.top + pointer.fy * c.height };
      }
      // le posizioni si rileggono a ogni fotogramma: cambiando peso le lettere si spostano
      const rects = p ? col.lettere.map(l => l.getBoundingClientRect()) : null;
      col.lettere.forEach((l, i) => {
        let target = base;
        if (rects) {
          const r = rects[i], d = Math.hypot(r.left + r.width / 2 - p.x, r.top + r.height / 2 - p.y);
          if (d < R) target = base + (centro - base) * (0.5 + 0.5 * Math.cos((Math.PI * d) / R));
        }
        col.pesi[i] += (target - col.pesi[i]) * (1 - Math.exp(-dt / SMORZA));
        if (Math.abs(col.pesi[i] - target) > 0.5) moving = true;
        l.style.fontWeight = Math.round(col.pesi[i]);
      });
    }
    loop = moving || pointer ? requestAnimationFrame(frame) : 0;
    if (!loop) prev = 0;
  }
  const avvia = () => { if (!loop) loop = requestAnimationFrame(frame); };
  if (FINE && !REDUCED) for (const col of colonne) {
    col.cella.addEventListener('pointermove', e => {
      const c = col.cella.getBoundingClientRect();
      pointer = { fx: (e.clientX - c.left) / c.width, fy: (e.clientY - c.top) / c.height };
      avvia();
    });
    col.cella.addEventListener('pointerleave', () => { pointer = null; avvia(); });
  }

  /* cifre tabellari: "1111" e "0000" con tnum devono essere larghi uguali; se no il numero che conta balla */
  function tabellari(f) {
    const s = document.createElement('span');
    s.style.cssText = `position:absolute;visibility:hidden;font:800 100px ${f};font-variant-numeric:tabular-nums;white-space:nowrap`;
    document.body.append(s);
    s.textContent = '1111'; const a = s.getBoundingClientRect().width;
    s.textContent = '0000'; const b = s.getBoundingClientRect().width;
    s.remove();
    return Math.abs(a - b) < 0.5;
  }

  /* contatore: 0 → 142 e ricomincia, per vedere se le cifre ballano */
  function conta() {
    const cifre = document.querySelectorAll('[data-conta]');
    if (REDUCED) { cifre.forEach(c => (c.textContent = '142')); return; }
    let n = 0;
    setInterval(() => { n = (n + 1) % 143; cifre.forEach(c => (c.textContent = n)); }, 60);
  }

  function premi(attr, valore) {
    for (const b of document.querySelectorAll(`.bar [${attr}]`)) b.setAttribute('aria-pressed', String(b.getAttribute(attr) === valore));
  }
  for (const b of document.querySelectorAll('.bar [data-lente]')) b.addEventListener('click', () => { stato.lente = b.dataset.lente; premi('data-lente', stato.lente); componi(); });
  for (const b of document.querySelectorAll('.bar [data-fino]')) b.addEventListener('click', () => { stato.fino = +b.dataset.fino; premi('data-fino', b.dataset.fino); componi(); });
  campo.addEventListener('input', componi);
  let attesa = 0, finestra = innerWidth;
  addEventListener('resize', () => {
    if (innerWidth === finestra) return;
    finestra = innerWidth;
    clearTimeout(attesa);
    attesa = setTimeout(componi, 150);
  });

  document.fonts.ready.then(() => {
    componi();
    for (const col of colonne) {
      const si = tabellari(col.font.f);
      const tab = col.el.querySelector('.tab');
      tab.textContent = 'cifre tabellari: ' + (si ? 'sì' : 'no');
      tab.className = 'tab ' + (si ? 'sì' : 'no');
    }
    conta();
  });
</script>
</body>
</html>
